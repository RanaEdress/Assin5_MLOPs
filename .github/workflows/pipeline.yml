name: ML Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data with DVC
        run: dvc pull

      - run: echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV

      - run: python train.py

      - uses: actions/upload-artifact@v4
        with:
          name: model_info
          path: |
            model_info.txt
            mlruns/

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - run: pip install mlflow

      - uses: actions/download-artifact@v4
        with:
          name: model_info

      - run: echo "MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }}" >> $GITHUB_ENV

      - run: python check_threshold.py

      - run: echo "Building Docker image for Run ID: $(cat model_info.txt)"
      - run: docker build --build-arg RUN_ID=$(cat model_info.txt) -t my-model:latest .